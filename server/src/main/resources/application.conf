gamearena {
  port = 8080

  web-root = "../app/webApp/build/dist/wasmJs/productionExecutable"

  database-path = "data/gamearena.db"

  admin {
    username = "admin"
    password = "supersecret"
  }

  firebase {
    googleCredentialsPath = "firebase.json"
  }

  // Optional web-push (VAPID) keys for browser push notifications.
  // Generate keys using a web-push tool (e.g. node-web-push: `npx web-push generate-vapid-keys`) and
  // store them here in base64 URL-safe format (public and private).
  // For production, prefer environment overrides (GAMEARENA_CONFIG) or a secrets store.
  webpush {
    publicKey = "" // e.g. "BEl...-_"
    privateKey = "" // e.g. "X1_..."
  }
}
