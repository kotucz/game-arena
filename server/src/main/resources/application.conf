gamearena {
  port = 8080

  web-root = "../app/webApp/build/dist/wasmJs/productionExecutable"

  database-path = "data/gamearena.db"

  ai-player {
    # ADK session history is stored as JSON files under this directory.
    session-storage-directory = "data/adk/adk_sessions.db"
    gemini {
      # Set GEMINI_API_KEY in the environment to enable the MVP AI player.
      api-key = ${?GEMINI_API_KEY}
      model = "gemini-flash-latest"
    }
  }

  admin {
    username = "admin"
    password = "supersecret"
  }

  firebase {
    googleCredentialsPath = "firebase.json"

    # Public web SDK config — safe to serve to the browser client.
    # Update from: Firebase Console → Project Settings → Your apps → (Web app) → SDK snippet
    webConfig {
      apiKey            = ""
      authDomain        = ""
      projectId         = ""
      storageBucket     = ""
      messagingSenderId = ""
      appId             = ""
    }

    # FCM Web Push VAPID key — served to the browser so it can call getToken().
    # From: Firebase Console → Project Settings → Cloud Messaging → Web Push certificates → Key pair
    webVapidKey = ""
  }
}
