name: Build and Publish Container

on:
  push:
    tags:
      - 'v*' # Triggers on release tags, e.g. v1.0.0
  workflow_dispatch: # Allows manually running from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Automatically caches Gradle wrapper & dependencies

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Run the heavy compilation on GitHub Actions infrastructure
      - name: Build WASM and Ktor Install Distribution
        run: ./gradlew --no-daemon :app:webApp:wasmJsBrowserDistribution :server:installDist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Assemble the runtime Dockerfile
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/game-arena:latest
            ghcr.io/${{ github.repository_owner }}/game-arena:${{ github.ref_name }}